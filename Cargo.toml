[package]
name = "aworld"
version = "0.1.0"
edition = "2021"
default-run = "aworld"

[[bin]]
name = "aworld"
path = "src/main.rs"

# The little web server shipped with the web package.
[[bin]]
name = "aworld-serve"
path = "src/bin/serve.rs"

[dependencies]
rapier2d = "0.36"
rayon = "1.12.0"

# The window and its events (src/gfx): winit. Every pixel, and the liquids' computations
# (src/world/mgpcg_gpu.rs), on one wgpu device: Vulkan, Metal and DirectX 12 on the desktop.
winit = "0.30"
wgpu = { version = "24", features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }
pollster = "0.4"
web-time = "1"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
# The letters of the font, rasterized into the text atlas.
fontdue = "0.9"
# Screenshots (--demo).
png = "0.17"

# Sound (src/sound/out.rs): one mixer everywhere. cpal plays it on Windows, macOS and the web;
# on Linux cpal would link ALSA at build time, so Linux loads ALSA when the game starts instead.
[target.'cfg(not(any(target_os = "linux", target_arch = "wasm32")))'.dependencies]
cpal = "0.15"

# The web build: the page's canvas, its event loop and WebAudio. `wasm-bindgen` is pinned: the
# `wasm-bindgen` command that build.sh runs must be the same version.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15", features = ["wasm-bindgen"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window", "EventTarget"] }

[features]
default = ["sound"]
# Without it the game is always silent. Nothing to install either way, on any system.
sound = []

[profile.dev]
opt-level = 2

[dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph"] }
rustc-demangle = "0.1"
