[package]
name = "aworld"
version = "0.1.0"
edition = "2021"
default-run = "aworld"

[[bin]]
name = "aworld"
path = "src/main.rs"

# The little web server shipped with the web package.
[[bin]]
name = "aworld-serve"
path = "src/bin/serve.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false }
rapier2d = "0.36"
rayon = "1.12.0"

# Sound (src/sound/out.rs): macroquad's audio everywhere but Linux, where macroquad would link
# ALSA at build time. Linux has its own mixer and loads ALSA when the game starts instead.
[target.'cfg(not(target_os = "linux"))'.dependencies]
macroquad = { version = "0.4", default-features = false, features = ["audio"] }

# The pressure of the liquids on the GPU (src/world/mgpcg_gpu.rs): wgpu reaches Vulkan, Metal and
# DirectX 12 on the desktop. (In the browser it will come with WebGPU, once the game draws with
# wgpu as well; until then the web build solves on the CPU.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "24"
pollster = "0.4"

[features]
default = ["sound"]
# Without it the game is always silent. Nothing to install either way, on any system.
sound = []

[profile.dev]
opt-level = 2

[dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph"] }
rustc-demangle = "0.1"
