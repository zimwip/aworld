<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWorld</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #12151f; }
    canvas#glcanvas { position: relative; z-index: 1; display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #8a93ad; font: 18px system-ui, sans-serif; pointer-events: none; z-index: 0; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="loading">Chargement d'AWorld…</div>
  <script type="module">
    // The game (aworld_bg.wasm) and its glue (aworld.js), made by wasm-bindgen: it draws with
    // WebGPU, or WebGL 2 where the browser has no WebGPU.
    import init from "./aworld.js";
    // Keys (Esc, Space...) only reach the game when the canvas has the focus.
    const cv = document.getElementById("glcanvas");
    cv.focus();
    window.addEventListener("pointerdown", () => cv.focus());
    // The canvas is opaque once the game draws, which hides the loading text behind it.
    init();
  </script>
</body>
</html>
